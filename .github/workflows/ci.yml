name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test
